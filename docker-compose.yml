# ============================================================================
# Nouf-ex — API container (monorepo build, connects to external PostgreSQL 17).
# ----------------------------------------------------------------------------
# The Postgres server is NOT created here. It must already exist on the host
# (or on another reachable network) and contain the `noufex_db` database.
#
# The container connects as the least-privilege role `noufex_app`. The
# `postgres` superuser is only used to run `npm run db:setup` once on the
# host (creates the role + schema + seed).
#
# All secrets come from the host's .env file (gitignored) so the placeholder
# `CHANGE_ME_APP` never ships to a running stack. The defaults below match
# Docker Desktop; on Linux the host gateway maps to `host.docker.internal`
# via the `extra_hosts` block at the bottom.
#
# Security hardening (OWASP ASVS, NIST SP 800-53, 12-Factor App):
#   - Dedicated network isolation (AC-3, ASVS 4.1.1)
#   - Read-only root filesystem (AC-6, ASVS 4.1.1)
#   - No new privileges (AC-6.1, AC-6.2)
#   - All capabilities dropped (least privilege)
#   - tmpfs for writable paths
#   - Graceful shutdown (SIGTERM with 30s grace period)
#   - DB credentials via .env file (IA-5)
# ============================================================================
services:
  noufex:
    build:
      context: .
      dockerfile: Dockerfile
    image: noufex:latest
    container_name: Nouf-ex
    restart: on-failure:5
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:3000:3000'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    # --- Security hardening (NIST SP 800-53 AC-6, OWASP ASVS 4.1.1) ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /app/tmp:size=32M
    # --- Network isolation (OWASP ASVS 4.1.1, NIST AC-3) ---
    # Dedicated network prevents other containers from reaching the API.
    # Only the host port 127.0.0.1:3000 is exposed externally.
    networks:
      - noufex-internal
    # --- Environment ---
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      HOST: 0.0.0.0
      # Force the DB host to host.docker.internal so the container reaches
      # the host's Postgres via the `extra_hosts` mapping below, regardless
      # of the value the developer has set in .env for local dev (which is
      # usually 127.0.0.1 — that resolves to the container itself!).
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-noufex_db}
      DB_USER: ${DB_USER:-noufex_app}
      DB_PASSWORD: ${DB_PASSWORD}
      # Construct DATABASE_URL from individual vars to avoid embedding
      # plaintext passwords in the compose file. The host's .env file
      # may contain a stale DATABASE_URL for local dev — we override it
      # here so the container always uses the correct host.docker.internal.
      DATABASE_URL: postgresql://${DB_USER:-noufex_app}:${DB_PASSWORD}@host.docker.internal:${DB_PORT:-5432}/${DB_NAME:-noufex_db}
      DB_SSL: ${DB_SSL:-true}
      SERVE_STATIC: 'true'
      # SPA bundle ships at apps/web/dist in the new monorepo layout.
      STATIC_PATH: /app/apps/web/dist
      AUTH_SECRET: ${AUTH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'node -e ''import("node:http").then(h => h.get("http://localhost:3000/api/health", r => { if (r.statusCode !== 200) process.exit(1) }))'''
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

# --- Dedicated network for the API service ---
# Prevents other containers on the default bridge from reaching the API.
# Only the host port 127.0.0.1:3000 is exposed externally.
networks:
  noufex-internal:
    name: noufex-internal
    driver: bridge
