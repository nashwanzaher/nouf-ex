# =====================================================================
# Markdown link checker — fails the build if any internal `.md` link
# is broken. Pairs with the `mkdocs build --strict` step in docs.yml
# to catch link drift both ways.
# ---------------------------------------------------------------------
# Why both?
#   - `markdown-link-check` catches issues even when the docs site
#     is not being rebuilt (a standalone check during PR review).
#   - `mkdocs --strict` catches navigation-time issues that are
#     outside the scope of a single page (orphan files, bad refs in
#     nav, etc.).
# ---------------------------------------------------------------------
# Configuration: `.markdown-link-check.json` at `docs/`.
# Standards referenced:
#   - Microsoft Docs guidance on doc health monitoring
#   - GitHub Actions documentation
# =====================================================================

name: Link Check

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/.markdown-link-check.json"
      - ".github/workflows/link-check.yml"
  schedule:
    # Nightly at 06:00 UTC — catches external link rot
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check links in ${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      # Two matrix entries: docs/ + audit + root. Splits the work
      # to keep per-job time below ~3 min on a typical PR.
      fail-fast: false
      matrix:
        scope:
          - docs
          - root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No cache-dependency-path: this workflow only runs
          # `npm install --no-save` for a single CLI tool, so the
          # `node_modules` cache doesn't help and pointing at the
          # repo-root `package-lock.json` would fail (the project
          # lives under `app/` after the 2026-07-03 restructuring).
          # `actions/setup-node` will simply skip caching when no
          # lockfile is configured.
          cache: npm

      - name: Install markdown-link-check
        # We install it from npm-cache so we don't hit the registry
        # twice. The action itself bundles the binary.
        run: |
          npm install --no-save --no-audit --no-fund \
            markdown-link-check@3.12.2

      - name: Check links
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          case "${{ matrix.scope }}" in
            docs)
              PATTERN='docs/**/*.md'
              ;;
            root)
              PATTERN='*.md'
              ;;
          esac
          failed=0
          files=()
          # shellcheck disable=SC2086
          for file in $PATTERN; do
            files+=("$file")
          done
          echo "Checking ${#files[@]} files in scope '${{ matrix.scope }}'"
          for file in "${files[@]}"; do
            npx markdown-link-check \
              --config docs/.markdown-link-check.json \
              --quiet \
              "$file" || {
                echo "::error file=$file::Broken links in $file"
                failed=1
              }
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Markdown link check failed — see annotations above."
            exit 1
          fi
