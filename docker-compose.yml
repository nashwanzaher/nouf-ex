# ============================================================================
# Nouf-ex — API container (connects to an existing external PostgreSQL 17).
# ----------------------------------------------------------------------------
# The Postgres server is NOT created here. It must already exist on the host
# (or on another reachable network) and contain the `noufex_db` database.
#
# The container connects as the least-privilege role `noufex_app`. The
# `postgres` superuser is only used to run `npm run db:setup` once on the
# host (creates the role + schema + seed).
#
# On Docker Desktop for Windows / Mac, `host.docker.internal` maps to the
# host machine's loopback. On Linux, the `extra_hosts` block below maps
# the same hostname to the host gateway.
# ============================================================================
services:
  noufex:
    build:
      context: .
      dockerfile: Dockerfile
    image: noufex:latest
    container_name: Nouf-ex
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      HOST: 0.0.0.0
      # App connects as the dedicated least-privilege role.
      DB_HOST: host.docker.internal
      DB_PORT: '5432'
      DB_NAME: noufex_db
      DB_USER: noufex_app
      DB_PASSWORD: 'CHANGE_ME_APP'
      DATABASE_URL: postgresql://noufex_app:CHANGE_ME_APP@host.docker.internal:5432/noufex_db
      # Set DB_SSL=true in production when Postgres requires TLS.
      DB_SSL: 'false'
      SERVE_STATIC: 'true'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - "node -e \"require('http').get('http://localhost:3000/api/health', (r) => { if (r.statusCode !== 200) process.exit(1) })\""
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
