# Nouf-ex — CI/CD pipeline (npm workspaces monorepo)
#
# Pipeline order is deliberate (cheap → expensive) so we fail fast.
# Each job is named with a stable `displayName` so branch-protection
# rules can require them by name.
#
# Job pipeline:
#   ci / docs-presence     — pre-flight (no Node.js needed)
#   ci / lint              — eslint across all workspaces
#   ci / typecheck         — tsc across all workspaces
#   ci / mcp-server        — build MCP server (depends on ^build)
#   ci / test              — vitest (server unit + a11y)
#   ci / build             — vite SPA + esbuild API
#   ci / db-integration    — real postgres:17 service container
#   ci / server-boot       — boot API + curl /api/health, /api/ready, /api/stats/home
#
# All installs use the root `npm ci` which hoists deps for every
# workspace. The `apps/api` and `apps/web` workspaces are then run
# with `npm run <script>` from inside their directory.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs of the same workflow when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions for the default token (least privilege for checks).
permissions:
  contents: read

env:
  # Node version used by all jobs. Pinned to 20 to match the Dockerfile
  # and the local-dev docs.
  NODE_VERSION: '20.19'
  # Connection for the integration tests. `noufex_app` is the runtime
  # role (least privilege) so we catch schema/permission regressions.
  DB_HOST: localhost
  DB_PORT: '5432'
  DB_NAME: noufex_db
  DB_USER: noufex_app
  DB_PASSWORD: noufex_app_test_password_only
  DATABASE_URL: postgresql://noufex_app:noufex_app_test_password_only@localhost:5432/noufex_db
  # 32-byte secret for HMAC token signing in tests. Must be ≥32 chars.
  AUTH_SECRET: test-secret-must-be-at-least-32-chars-long-xyz
  CI: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 0. Docs presence (pre-flight, no Node.js needed)
  #    Verifies that the canonical documentation files exist.
  #    Updated 2026-07-11: ARCHITECTURE.md replaces the old
  #    scattered docs.
  # ─────────────────────────────────────────────────────────────────
  docs-presence:
    name: Docs presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the canonical documentation files exist
        run: |
          missing=0
          for f in README.md LICENSE CHANGELOG.md ARCHITECTURE.md \
                   .github/CONTRIBUTING.md .github/CODE_OF_CONDUCT.md \
                   .github/SECURITY.md .github/PULL_REQUEST_TEMPLATE.md \
                   .github/ISSUE_TEMPLATE/bug_report.md \
                   .github/ISSUE_TEMPLATE/feature_request.md \
                   docs/README.md; do
            if [ ! -f "$f" ]; then
              echo "::error::missing: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing canonical documentation files missing"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────
  # 1. Lint (cheap, blocks merges on warnings)
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [docs-presence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  # ─────────────────────────────────────────────────────────────────
  # 2. TypeScript check across every workspace via Turbo
  # ─────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  # ─────────────────────────────────────────────────────────────────
  # 3. MCP server build (depends on shared/types)
  # ─────────────────────────────────────────────────────────────────
  mcp-server:
    name: MCP server build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @noufex/mcp-server

  # ─────────────────────────────────────────────────────────────────
  # 4. Unit + integration tests (no DB; pg is mocked)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API unit + integration tests
        run: npm run test -w @noufex/api
      - name: Web component + a11y tests
        run: npm run test -w @noufex/web
      - name: Upload coverage artifact (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage/
            apps/web/coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # 5. Production build (vite SPA + esbuild API)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, mcp-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: noufex-build
          path: |
            apps/web/dist
            apps/api/dist
            apps/mcp-server/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 6. DB-integration (real postgres:17, applies schema + seed)
  #    SECURITY: roles.sql contains CREATE ROLE / GRANT statements that
  #    require the `postgres` superuser. We therefore split into two phases:
  #      Phase A: as `postgres`, run db:setup (creates noufex_app + schema)
  #      Phase B: as `noufex_app`, exercise the schema to catch permission
  #               regressions that would only manifest at runtime.
  # ─────────────────────────────────────────────────────────────────
  db-integration:
    name: DB Integration
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'push' || contains(github.head_ref, 'db')
    services:
      postgres:
        image: postgres:17
        env:
          # Bootstrap as the default `postgres` superuser so we can CREATE ROLE.
          # The `noufex_app` runtime role is created by roles.sql inside db:setup.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_superuser_test_password_only
          POSTGRES_DB: noufex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Superuser connection for phase A (db:setup needs CREATE ROLE).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_superuser_test_password_only
      DATABASE_URL_SUPERUSER: postgresql://postgres:postgres_superuser_test_password_only@localhost:5432/noufex_db
      # App-role connection for phase B (mirrors production).
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: noufex_db
      DB_USER: noufex_app
      DB_PASSWORD: noufex_app_test_password_only
      DATABASE_URL: postgresql://noufex_app:noufex_app_test_password_only@localhost:5432/noufex_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Phase A — db:setup as postgres (creates roles + applies schema + seed)
        run: |
          DATABASE_URL=$DATABASE_URL_SUPERUSER node scripts/db/db-setup.cjs
      - name: Phase B — verify noufex_app can read every public table
        run: |
          node -e "const{Client}=require('pg');(async()=>{
            const c=new Client({connectionString:process.env.DATABASE_URL});
            await c.connect();
            const tables=['users','stores','products','orders','reviews'];
            for(const t of tables){
              const r=await c.query('SELECT COUNT(*)::int AS n FROM '+t);
              console.log(t+':',r.rows[0].n);
            }
            const m=await c.query('SELECT current_user, version()');
            console.log('as:',m.rows[0].current_user,'|',m.rows[0].version.slice(0,40));
            await c.end();
          })()"

  # ─────────────────────────────────────────────────────────────────
  # 7. Server boot smoke (boots the real API against real postgres).
  #    Same role-separation pattern as db-integration: bootstrap as
  #    `postgres`, run db:setup, then exercise the API as `noufex_app`.
  # ─────────────────────────────────────────────────────────────────
  server-boot:
    name: Server Boot Smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'push' || contains(github.head_ref, 'server') || contains(github.head_ref, 'ci')
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_superuser_test_password_only
          POSTGRES_DB: noufex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      API_PORT: '3000'
      # Phase A: db:setup needs postgres superuser to CREATE ROLE.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_superuser_test_password_only
      DATABASE_URL_SUPERUSER: postgresql://postgres:postgres_superuser_test_password_only@localhost:5432/noufex_db
      # Phase B: app runtime uses the least-privilege role.
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: noufex_db
      DB_USER: noufex_app
      DB_PASSWORD: noufex_app_test_password_only
      DATABASE_URL: postgresql://noufex_app:noufex_app_test_password_only@localhost:5432/noufex_db
      AUTH_SECRET: test-secret-must-be-at-least-32-chars-long-xyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Apply schema + seed (as postgres superuser)
        run: DATABASE_URL=$DATABASE_URL_SUPERUSER node scripts/db/db-setup.cjs
      - name: Boot API + smoke
        run: |
          set -e
          cd apps/api
          (npx tsx src/index.ts > /tmp/noufex-api.log 2>&1) &
          API_PID=$!
          trap "kill $API_PID 2>/dev/null || true" EXIT
          # Wait up to 30s for the server to come up.
          BOOTED=0
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "API ready after ${i}s (health=$CODE)"
              BOOTED=1
              break
            fi
            sleep 1
          done
          if [ "$BOOTED" != "1" ]; then
            echo "API did not become ready within 30s"
            echo "--- API log ---"
            cat /tmp/noufex-api.log
            exit 1
          fi
          # Public smoke checks. /api/health, /api/ready and
          # /api/stats/home are the un-authenticated landing-page
          # endpoints. All three must return 200.
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)
          READY=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready)
          STATS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/stats/home)
          echo "health: $HEALTH  ready: $READY  stats: $STATS"
          if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ] || [ "$STATS" != "200" ]; then
            echo "Smoke check failed"
            echo "--- API log ---"
            cat /tmp/noufex-api.log
            exit 1
          fi
          # Body shape sanity: /api/health must report status=ok and
          # an uptime_s number. Catches a 200-with-broken-JSON regression.
          HEALTH_BODY=$(curl -sS http://127.0.0.1:3000/api/health)
          echo "health body: $HEALTH_BODY"
          echo "$HEALTH_BODY" | grep -q '"status":"ok"' || { echo "health body missing status:ok"; exit 1; }
          echo "$HEALTH_BODY" | grep -q '"uptime_s":' || { echo "health body missing uptime_s"; exit 1; }