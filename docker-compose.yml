# ============================================================================
# Nouf-ex — API container (connects to an existing external PostgreSQL 17).
# ----------------------------------------------------------------------------
# The Postgres server is NOT created here. It must already exist on the host
# (or on another reachable network) and contain the `noufex_db` database.
#
# The container connects as the least-privilege role `noufex_app`. The
# `postgres` superuser is only used to run `npm run db:setup` once on the
# host (creates the role + schema + seed).
#
# All secrets come from the host's .env file (gitignored) so the placeholder
# `CHANGE_ME_APP` never ships to a running stack. The defaults below match
# Docker Desktop; on Linux the host gateway maps to `host.docker.internal`
# via the `extra_hosts` block at the bottom.
# ============================================================================
services:
  noufex:
    build:
      context: .
      dockerfile: Dockerfile
    image: noufex:latest
    container_name: Nouf-ex
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      HOST: 0.0.0.0
      # App connects as the dedicated least-privilege role. Values are
      # sourced from .env (see env_file above); defaults match Docker
      # Desktop. On Linux, host.docker.internal maps to the host
      # gateway via extra_hosts below.
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-noufex_db}
      DB_USER: ${DB_USER:-noufex_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      # DB_SSL defaults to true (secure-by-default). The noufex_db
      # server already accepts TLS via the standard `sslmode=require`
      # in DATABASE_URL; to opt out locally set DB_SSL=false in .env.
      DB_SSL: ${DB_SSL:-true}
      SERVE_STATIC: 'true'
      # SPA bundle is copied to /app/dist in the build stage. The
      # server's __dirname inside the esbuild bundle is /app/server
      # (the bundle's location), so the default STATIC_PATH would
      # resolve to /app/server/dist which is wrong. Pin it to the
      # copy target explicitly.
      STATIC_PATH: /app/dist
      # HMAC signing key for the auth bearer tokens. Required in
      # production (≥32 chars). Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      AUTH_SECRET: ${AUTH_SECRET}
      # Comma-separated list of allowed CORS origins. The server
      # default works for local dev; override here for production.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Set TRUST_PROXY to 'true' / '1' / 'loopback' / CIDR list when
      # running behind nginx, k8s ingress, or a load balancer.
      TRUST_PROXY: ${TRUST_PROXY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'node -e "require(''http'').get(''http://localhost:3000/api/health'', (r) => { if (r.statusCode !== 200) process.exit(1) })"'
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
