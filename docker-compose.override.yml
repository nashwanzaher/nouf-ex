# ============================================================================
# Docker Compose override — adds OpenClaw / OpenCode AI server
# ----------------------------------------------------------------------------
# This file is automatically merged with docker-compose.yml by Docker Compose.
# It adds a headless AI coding assistant container to the Noufex stack so both
# can be started/managed together from Docker Desktop.
#
# The service has profile "openclaw" so it does NOT start by default when you
# run `docker compose up`. Start it explicitly with:
#   docker compose --profile openclaw up -d --build
#
# Or from Docker Desktop: select the Noufex project → Containers →
# Noufex-OpenClaw → Start.
#
# Access:
#   - Web UI: http://localhost:3001
#   - CLI attach: opencode attach http://localhost:3001 -u <username> -p <password>
#     (credentials come from OPENCODE_SERVER_USERNAME / OPENCODE_SERVER_PASSWORD
#      env vars; generate with: openssl rand -base64 24)
#
# Security hardening (OWASP ASVS, NIST SP 800-53):
#   - Credential require (no fallback defaults)
#   - Read-only root filesystem
#   - No new privileges + cap_drop ALL
#   - Workspace mount scoped (not full host root)
# ============================================================================

services:
  openclaw:
    build:
      context: .
      dockerfile: docker/openclaw/Dockerfile
    image: noufex-openclaw:latest
    container_name: Nouf-ex-OpenClaw
    restart: on-failure:5
    profiles:
      - openclaw
    ports:
      - '127.0.0.1:3001:3001'
    # --- Security hardening (NIST SP 800-53 AC-6) ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only root filesystem — OpenClaw writes only to /data/.openclaw
    # and /workspace, which are bind/named volumes.
    read_only: true
    tmpfs:
      - /tmp:size=64M
    # --- Container labels ---
    labels:
      - "com.noufex.service=openclaw"
      - "com.noufex.version=latest"
      - "com.noufex.environment=production"
    # --- Log rotation ---
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # SECURITY (OWASP ASVS 6.1.3): Mount only specific subdirectories
      # needed for code editing, not the full project root which includes
      # .env, .git, node_modules, and other sensitive files.
      - ./apps:/workspace/apps
      - ./packages:/workspace/packages
      - ./scripts:/workspace/scripts
      - ./docs:/workspace/docs
      # Named volume for OpenClaw config, sessions, and memory.
      - openclaw-data:/data/.openclaw
    environment:
      # SECURITY: no fallback defaults. Container fails fast if the operator
      # has not provided credentials via the host's .env file.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:?OPENCODE_SERVER_USERNAME is required}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      OPENCODE_WORKSPACE: /workspace
    working_dir: /workspace
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'wget -qO- --user="$${OPENCODE_SERVER_USERNAME}" --password="$${OPENCODE_SERVER_PASSWORD}" http://localhost:3001/health || exit 1'
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  openclaw-data:
    name: noufex_openclaw_data
