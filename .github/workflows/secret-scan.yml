# ============================================================================
# Nouf-ex — secret scanning (gitleaks)
# ----------------------------------------------------------------------------
# Scans the full git history (and current diff) for accidentally committed
# secrets, API keys, database URLs, HMAC tokens, etc. Runs on every push and
# PR, plus a nightly schedule that catches secrets added by force-pushes
# that bypassed PR review.
#
# Why gitleaks instead of GitHub's native secret-scanning:
#   - Native scanning only catches *known* patterns and partner-issued keys.
#   - gitleaks catches application-specific patterns (AUTH_SECRET, DB_URL,
#     custom API tokens) which is what our security audit (2026-07) found.
#
# Permission: contents:read (default).
# ============================================================================

name: Secret Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * *'  # nightly at 03:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # GITHUB_TOKEN is auto-provided; gitleaks-action reads it for PR
          # annotations and the Security tab upload.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the public gitleaks config + a project-local ruleset if present.
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true