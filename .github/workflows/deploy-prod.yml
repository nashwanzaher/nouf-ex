# Production deployment workflow for Nouf-ex.
#
# Triggers:
#   - Push of a semver tag (vX.Y.Z) to any branch
#   - Manual dispatch via the Actions tab (with reason input)
#
# Required GitHub Actions secrets (Settings > Secrets and variables > Actions):
#   - PROD_SSH_KEY          SSH private key (deploy key) for the production host
#   - PROD_HOST             SSH hostname of the production server
#   - PROD_USER             SSH username on the production server
#   - PROD_URL              Public URL for smoke checks (e.g. https://noufex.example.com)
#   - AUTH_SECRET_PROD      HMAC key (>=32 chars) for the production environment
#   - DB_PASSWORD_PROD      postgres password for the production database
#   - DATABASE_URL_PROD     full postgresql:// connection string for noufex_app
#
# Process documentation (manual approval, rollback, post-deploy checklist):
#   docs/operations/deploy-prod-process.md
#
# Standards: GitHub Actions Environments + Deployment protection rules
#   https://docs.github.com/en/actions/deployment/targeting-different-environments
#   https://docs.github.com/en/deployment/protecting-deployments

name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are we deploying? (POSTED IN CHANGELOG)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Production deploys must never be cancelled mid-flight.
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.PROD_URL }}
    steps:
      - name: Validate semver tag
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not semver. Use vX.Y.Z format."
            exit 1
          fi
          echo "Deploying semver tag: $TAG"

      - name: Pre-deploy safety check
        run: |
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "::error::Tag ${{ github.sha }} is not an ancestor of main."
            exit 1
          fi
          echo "Safety check passed: tag is on main."

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          name: noufex-build
          path: build/

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Upload artefacts to production
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            "mkdir -p /opt/noufex/build/app/dist /opt/noufex/build/app/server"
          scp -r build/app/dist/. ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/noufex/build/app/dist/
          scp build/app/server/index.js ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/noufex/build/app/server/

      - name: Apply env + restart stack on production
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET_PROD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PROD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} <<'EOF'
            set -e
            cd /opt/noufex
            
            # Create backup before deploy
            if [ -d "app/server" ]; then
              cp -r app/server app/server.bak.$(date +%s) 2>/dev/null || true
              cp -r app/dist app/dist.bak.$(date +%s) 2>/dev/null || true
            fi
            
            (cd app && npm ci --no-audit --no-fund && npm run db:setup) || true
            mv build/app/dist/* app/dist/ 2>/dev/null || true
            mv build/app/server/index.js app/server/
            rm -rf build
            cat > .env <<EOT
NODE_ENV=production
API_PORT=3000
HOST=0.0.0.0
SERVE_STATIC=true
STATIC_PATH=/app/dist
DB_HOST=${DB_HOST:-localhost}
DB_PORT=${DB_PORT:-5432}
DB_NAME=${DB_NAME:-noufex_db}
DB_USER=${DB_USER:-noufex_app}
DB_PASSWORD=${DB_PASSWORD}
DATABASE_URL=${DATABASE_URL}
AUTH_SECRET=${AUTH_SECRET}
ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://noufex.example.com}
LOG_LEVEL=info
EOT
            cd /opt/noufex
            docker compose restart noufex
          EOF

      - name: Wait + smoke checks with rollback
        run: |
          BASE="${{ secrets.PROD_URL }}"
          echo "Waiting for $BASE/api/health ..."
          ROLLBACK_NEEDED=0
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/health" 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Production API ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::API did not come back up within 60s — triggering rollback"
              ROLLBACK_NEEDED=1
            fi
            sleep 2
          done
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/health")
          READY=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/ready")
          STATS=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/stats/home")
          if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ] || [ "$STATS" != "200" ]; then
            echo "::error::Production smoke failed — triggering rollback"
            ROLLBACK_NEEDED=1
          fi
          if [ "$ROLLBACK_NEEDED" = "1" ]; then
            echo "Rolling back to previous version..."
            ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} <<'RBEOF'
              set -e
              cd /opt/noufex
              LATEST_BAK=$(ls -td app/server.bak.* 2>/dev/null | head -1)
              LATEST_DIST=$(ls -td app/dist.bak.* 2>/dev/null | head -1)
              if [ -n "$LATEST_BAK" ]; then
                rm -rf app/server
                mv "$LATEST_BAK" app/server
                echo "Server rolled back"
              fi
              if [ -n "$LATEST_DIST" ]; then
                rm -rf app/dist
                mv "$LATEST_DIST" app/dist
                echo "Static files rolled back"
              fi
              docker compose restart noufex
            RBEOF
            echo "::error::Rollback completed"
            exit 1
          fi
          echo "Production smoke passed: health=$HEALTH ready=$READY stats=$STATS"

      - name: Confirm in production channel
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## Deployed ${{ github.ref_name }} to production." >> $GITHUB_STEP_SUMMARY
            echo "URL: ${{ secrets.PROD_URL }}" >> $GITHUB_STEP_SUMMARY
          fi