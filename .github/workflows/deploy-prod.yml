## 4. The `deploy-prod.yml` workflow

The workflow is dispatched manually (via version tag or
`workflow_dispatch`). It runs the same smoke tests as staging and
additionally validates the production database connection.

This is a reference example — adapt to your actual production host.

```yaml
# .github/workflows/deploy-prod.yml
name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are we deploying? (POSTED IN CHANGELOG)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # DO NOT cancel in-progress prod deploys

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.PROD_URL }}
    steps:
      - name: Validate semver tag
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not semver. Use vX.Y.Z format."
            exit 1
          fi
          echo "Deploying semver tag: $TAG"

      - name: Pre-deploy safety check
        run: |
          # Tag must be ahead of main (i.e. main points to the tagged commit
          # or to a descendant of it).
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "::error::Tag ${{ github.sha }} is not an ancestor of main."
            exit 1
          fi
          echo "Safety check passed: tag is on main."

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          name: noufex-build
          path: build/

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Upload artefacts to production
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            "mkdir -p /opt/noufex/build/app/dist /opt/noufex/build/app/server"
          scp -r build/app/dist/. ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/noufex/build/app/dist/
          scp build/app/server/index.js ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/opt/noufex/build/app/server/

      - name: Apply env + restart stack on production
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET_PROD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PROD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} <<'EOF'
            set -e
            cd /opt/noufex
            # Migrations first (idempotent).
            (cd app && npm ci --no-audit --no-fund && npm run db:setup) || true
            # Atomic artefact swap.
            mv build/app/dist/* app/dist/ 2>/dev/null || true
            mv build/app/server/index.js app/server/
            rm -rf build
            # Write the env file with PROD values.
            cat > .env <<EOT
            NODE_ENV=production
            API_PORT=3000
            HOST=0.0.0.0
            SERVE_STATIC=true
            STATIC_PATH=/app/dist
            DB_HOST=${DB_HOST:-localhost}
            DB_PORT=${DB_PORT:-5432}
            DB_NAME=${DB_NAME:-noufex_db}
            DB_USER=${DB_USER:-noufex_app}
            DB_PASSWORD=${DB_PASSWORD}
            DATABASE_URL=${DATABASE_URL}
            AUTH_SECRET=${AUTH_SECRET}
            ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://noufex.example.com}
            LOG_LEVEL=info
            EOT
            # Restart the production stack.
            cd /opt/noufex
            docker compose restart noufex
          EOF

      - name: Wait + smoke checks
        run: |
          BASE="${{ secrets.PROD_URL }}"
          echo "Waiting for $BASE/api/health ..."
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/health" 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Production API ready after ${i}s"
              break
            fi
            sleep 2
          done
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/health")
          READY=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/ready")
          STATS=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/stats/home")
          if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ] || [ "$STATS" != "200" ]; then
            echo "::error::Production smoke failed"
            exit 1
          fi
          echo "Production smoke passed: health=$HEALTH ready=$READY stats=$STATS"

      - name: Confirm in production channel
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## :rocket: Deployed ${{ github.ref_name }} to production." >> $GITHUB_STEP_SUMMARY
            echo "URL: ${{ secrets.PROD_URL }}" >> $GITHUB_STEP_SUMMARY
          fi
```

