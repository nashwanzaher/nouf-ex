# ---------------------------------------------------------------------
# EXCLUDES — never build these (rendered output is identical to source)
# ---------------------------------------------------------------------
# (archive/ was removed in 2026-07-07 cleanup; no excludes needed)
exclude_docs: ~

# ---------------------------------------------------------------------
# Strict mode: emit a warning on any internal broken link or missing
# file referenced from the navigation. This catches the same drift
# `markdown-link-check` catches in CI.
# ---------------------------------------------------------------------
strict: true
validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: ignore
  markup:
    failed_bodies: error
