# =====================================================================
# Build & deploy the MkDocs site to GitHub Pages.
# ---------------------------------------------------------------------
# Triggers:
#   - push to main        → rebuild + deploy
#   - pull_request to main→ build only (comment the link summary)
#   - workflow_dispatch   → manual rebuild
#
# Standards referenced:
#   - Microsoft Docs CI/CD guidance (https://learn.microsoft.com/azure/devops/pipelines/)
#   - GitHub Pages + Actions docs
# =====================================================================

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

# Required for deploying to GitHub Pages from a workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel in-progress runs of the SAME workflow — MkDocs site
# builds are idempotent, but concurrent deploys can race.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # full history for git-revision-date

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs + plugins
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build
        run: mkdocs build --strict --verbose
        # `--strict` makes warnings fail. Catches:
        #   - missing files referenced by nav
        #   - broken internal anchors
        #   - invalid MkDocs syntax

      - name: Verify no banned patterns
        # Guard rails: ban stub markers, TODO blocks, and old broken
        # paths that historically drifted in this repo.
        run: |
          ! grep -RIn --include='*.md' \
              -e '\bTODO\b' \
              -e '\bFIXME\b' \
              -e 'docs/audit/' \
              -e 'docs/research/' \
              docs/ || (
            echo "::error::Found stale references — fix before merging." >&2
            exit 1
          )

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
