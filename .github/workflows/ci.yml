# Nouf-ex — CI/CD pipeline
#
# Pipeline order is deliberate (cheap → expensive) so we fail fast.
# Each job is named with a stable `displayName` so branch-protection
# rules can require them by name. Names use a single colon as a
# separator so they read naturally in PR status checks:
#
#   ci / lint
#   ci / typecheck
#   ci / mcp-server
#   ci / test
#   ci / build
#   ci / db-integration
#   ci / server-boot
#
# Most checks reuse the `node_modules` cache via `actions/setup-node`'s
# built-in npm cache. The DB-integration and server-boot jobs spin up
# a real `postgres:17` service container.
#
# Adding a new job? Add it to the matrix in `branch-protection.md` and
# update `docs/development/ci-cd.md` §5.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs of the same workflow when a new commit lands.
# Each PR gets its own slot; subsequent pushes to the same PR cancel
# the previous in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions for the default token (least privilege for checks).
# jobs that need to comment on a PR or upload artifacts request
# narrow additional scopes.
permissions:
  contents: read

# Default env — see README §"Environment variables" for the per-job
# overrides. These are intentionally NOT secrets; they are public
# configuration values. AUTH_SECRET is set per-job from GitHub secrets
# where required.
env:
  # Node version used by all jobs. Pinned to 20 to match the Dockerfile
  # and the local-dev docs/development/getting-started.md.
  NODE_VERSION: '20'
  # Path to the API package — everything npm-related happens here.
  APP_DIR: app
  # Connection for the test job — uses the service container in
  # db-integration and server-boot. `noufex_app` is the runtime role
  # (least privilege) so we catch schema/permission regressions.
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: noufex_db
  DB_USER: noufex_app
  DB_PASSWORD: noufex_app_test_password_only
  DATABASE_URL: postgresql://noufex_app:noufex_app_test_password_only@localhost:5432/noufex_db
  # 32-byte secret for HMAC token signing in tests. Must be ≥32 chars.
  AUTH_SECRET: test-secret-must-be-at-least-32-chars-long-xyz
  # CI behaviour flags.
  CI: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lint (cheap, parallel, blocks merges on warnings)
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: cd ${{ env.APP_DIR }} && npm ci --no-audit --no-fund
      - run: cd ${{ env.APP_DIR }} && npx eslint . --max-warnings=0

  # ─────────────────────────────────────────────────────────────────
  # 2. TypeScript check (cheap, parallel)
  # ─────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: cd ${{ env.APP_DIR }} && npm ci --no-audit --no-fund
      - run: cd ${{ env.APP_DIR }} && npx tsc -b --noEmit
      - run: |
          cd mcp-server
          npm ci --no-audit --no-fund
          npm run typecheck

  # ─────────────────────────────────────────────────────────────────
  # 3. Unit tests (no DB; pg is mocked globally in app/tests/setup.ts)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: cd ${{ env.APP_DIR }} && npm ci --no-audit --no-fund
      - name: Run vitest
        run: cd ${{ env.APP_DIR }} && npm test
      - name: Upload coverage artifact (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ env.APP_DIR }}/coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # 4. Production build (vite SPA + esbuild API bundle)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: cd ${{ env.APP_DIR }} && npm ci --no-audit --no-fund
      - name: vite SPA + esbuild API
        run: cd ${{ env.APP_DIR }} && npm run build
      - name: Build mcp-server
        run: |
          cd mcp-server
          npm ci --no-audit --no-fund
          npm run build
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: noufex-build
          path: |
            ${{ env.APP_DIR }}/dist
            ${{ env.APP_DIR }}/server/index.js
            mcp-server/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 5. DB-integration (real postgres:17, applies schema + seed)
  # ─────────────────────────────────────────────────────────────────
  db-integration:
    name: DB Integration
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # Only run on main / when explicitly requested. Pull requests get
    # the unit-test job above which is fast and offline.
    if: github.event_name == 'push' || contains(github.head_ref, 'db')
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: noufex_app
          POSTGRES_PASSWORD: noufex_app_test_password_only
          POSTGRES_DB: noufex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noufex_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: cd ${{ env.APP_DIR }} && npm ci --no-audit --no-fund
      - name: Run db:setup
        run: node ../scripts/db-setup.cjs
      - name: Smoke (DB query via pg)
        run: |
          node -e "const{Client}=require('pg');(async()=>{
            const c=new Client({connectionString:process.env.DATABASE_URL});
            await c.connect();
            const r=await c.query('SELECT COUNT(*)::int AS n FROM users');
            console.log('users:',r.rows[0].n);
            await c.end();
          })()"

  # ─────────────────────────────────────────────────────────────────
  # 6. Server boot smoke (boots the real API against real postgres)
  # ─────────────────────────────────────────────────────────────────
  server-boot:
    name: Server Boot Smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'push' || contains(github.head_ref, 'db') || contains(github.head_ref, 'server') || contains(github.head_ref, 'ci')
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: noufex_app
          POSTGRES_PASSWORD: noufex_app_test_password_only
          POSTGRES_DB: noufex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noufex_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      API_PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: cd ${{ env.APP_DIR }} && npm ci --no-audit --no-fund
      - name: Apply schema + seed
        run: node ../scripts/db-setup.cjs
      - name: Boot API + smoke
        run: |
          set -e
          cd ${{ env.APP_DIR }}
          (npx tsx server/index.ts > /tmp/noufex-api.log 2>&1) &
          API_PID=$!
          trap "kill $API_PID 2>/dev/null || true" EXIT
          # Wait up to 30s for the server to come up.
          BOOTED=0
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "API ready after ${i}s (health=$CODE)"
              BOOTED=1
              break
            fi
            sleep 1
          done
          if [ "$BOOTED" != "1" ]; then
            echo "API did not become ready within 30s"
            echo "--- API log ---"
            cat /tmp/noufex-api.log
            exit 1
          fi
          # Public smoke checks. /api/health and /api/ready are
          # un-authenticated; /api/stats/home is the public landing-page
          # stats endpoint. All three must return 200.
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)
          READY=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready)
          STATS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/stats/home)
          echo "health: $HEALTH  ready: $READY  stats: $STATS"
          if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ] || [ "$STATS" != "200" ]; then
            echo "Smoke check failed"
            echo "--- API log ---"
            cat /tmp/noufex-api.log
            exit 1
          fi
          # Body shape sanity: /api/health must report status=ok and an
          # uptime_s number. Catches a 200-with-broken-JSON regression.
          HEALTH_BODY=$(curl -sS http://127.0.0.1:3000/api/health)
          echo "health body: $HEALTH_BODY"
          echo "$HEALTH_BODY" | grep -q '"status":"ok"' || { echo "health body missing status:ok"; exit 1; }
          echo "$HEALTH_BODY" | grep -q '"uptime_s":' || { echo "health body missing uptime_s"; exit 1; }
