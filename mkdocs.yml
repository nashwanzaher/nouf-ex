# =====================================================================
# MkDocs configuration for the Nouf-ex documentation site.
# ---------------------------------------------------------------------
# Standards referenced:
#   - Diátaxis        → https://diataxis.fr/
#   - MkDocs Material → https://squidfunk.github.io/mkdocs-material/
#   - IEEE 29119-3    → test documentation structure (sub-section 8.4)
# ---------------------------------------------------------------------
# This config is the SINGLE entry point for the docs CI pipeline
# (`.github/workflows/docs.yml`). It deploys to GitHub Pages on every
# push to `main` that touches `docs/**/*.md` or `mkdocs.yml`.
# =====================================================================

site_name: Nouf-ex
site_description: >-
  B2B/B2C e-commerce platform for Yemen & Middle East. React + Vite
  frontend, Express + PostgreSQL backend, IEEE-829/ISO-29119/ISTQB tested.
site_author: Nouf-ex maintainers
site_url: https://nashwanzaher.github.io/nouf-ex/
repo_url: https://github.com/nashwanzaher/nouf-ex
repo_name: nashwanzaher/nouf-ex
edit_uri: edit/main/docs/

# ---------------------------------------------------------------------
# Use Material for MkDocs — the de-facto MkDocs theme. Material theme
# has rich Diátaxis-friendly features: tabs, admonitions, code-copy,
# search, version selector, light/dark toggle.
# ---------------------------------------------------------------------
theme:
  name: material
  language: en
  features:
    - navigation.tabs           # tabs across the top
    - navigation.tabs.sticky    # tabs stay visible on scroll
    - navigation.sections       # expand nested sections
    - navigation.expand         # expand all by default
    - navigation.indexes        # allow section index pages
    - navigation.top            # back-to-top button
    - navigation.footer         # prev/next at page bottom
    - navigation.tracking       # URL follows scroll
    - toc.follow                # TOC follows scroll
    - search.suggest            # query suggestions
    - search.highlight          # highlight matches
    - search.share              # share search via URL
    - content.code.copy         # one-click copy on code blocks
    - content.code.annotate     # annotate code
    - content.tabs.link         # sync tabs across pages
    - content.tooltips          # hover tooltips for abbreviations
    - content.action.edit       # edit-this-page pencil
  palette:
    # Light scheme: primary teal/blue (Yemen flag accent)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark scheme: slate base + amber accent
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# ---------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------
plugins:
  # search (built-in) — enhanced by mkdocs-material
  - search:
      lang: [en, ar, zh]
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # minify HTML — speeds up GitHub Pages
  - minify:
      minify_html: true
  # git-revision-date-localised — "last updated" per page
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

# ---------------------------------------------------------------------
# Markdown extensions. We align with the Microsoft Docs style:
#   - admonitions for callouts (note/tip/warning/danger/info)
#   - attr_list / md_in_html for class hooks
#   - toc with permalinks
#   - tabbed content blocks
#   - def_list for ISTQB-style term/definition blocks
#   - footnotes for academic citations
# ---------------------------------------------------------------------
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details           # collapsible blocks
  - pymdownx.superfences       # fence-aware code blocks (nested fences)
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets          # built-in snippet loader
  - pymdownx.tabbed:           # synced tab groups
      alternate_style: true
  - pymdownx.tasklist:         # GFM task lists
      custom_checkbox: true
  - pymdownx.keys              # kbd-style keys
  - pymdownx.mark              # highlight mark ==text==
  - pymdownx.tilde             # ~~strike~~
  - pymdownx.caret             # ^^insert^^
  - pymdownx.smartsymbols      # ©, ™, →, etc.
  - pymdownx.emoji:            # :smile: emoji shortcodes
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# ---------------------------------------------------------------------
# Extra CSS — small project-specific touches (kept minimal)
# ---------------------------------------------------------------------
extra_css:
  - assets/css/extra.css

# ---------------------------------------------------------------------
# Extra — analytics placeholder; populate when site goes live
# ---------------------------------------------------------------------
extra:
  generator: false                       # hide "Made with MkDocs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nashwanzaher/nouf-ex
      name: Nouf-ex on GitHub
  # version_provider: mike  # enable when we publish versioned docs

# =====================================================================
