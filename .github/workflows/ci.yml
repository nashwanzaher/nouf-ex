# Nouf-ex — CI/CD pipeline
#
# Pipeline order is deliberate (cheap → expensive) so we fail fast:
#   1. lint           (eslint, ~10s)
#   2. typecheck      (tsc --noEmit, ~30s)
#   3. mcp-server     (typecheck the dedicated MCP server package, ~10s)
#   4. unit tests     (vitest, no DB required — pg is mocked globally, ~1m)
#   5. db:setup       (apply schema + seed against a service container, ~30s)
#   6. integration    (vitest against a live `noufex_app` role, optional)
#   7. build          (vite build, esbuild API, ~30s)
#
# The workflow uses a service container for PostgreSQL 17. Tests run with
# `noufex_app` (least privilege) so we catch schema/permission regressions.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs of the same workflow when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions for the default token (least privilege for checks).
permissions:
  contents: read

env:
  # Database connection for the test job — uses the service container.
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: noufex_db
  DB_USER: postgres
  DB_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noufex_db
  # 32-byte secret for HMAC token signing in tests.
  AUTH_SECRET: test-secret-must-be-at-least-32-chars-long-xxx

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Lint (cheap, parallel)
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci --no-audit --no-fund
      - run: cd app && npx eslint . --max-warnings=0

  # ───────────────────────────────────────────────────────────────────────────
  # 2. TypeScript check (cheap, parallel)
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci --no-audit --no-fund
      - run: cd app && npx tsc --noEmit -p tsconfig.app.json
      - run: cd mcp-server && npm ci --no-audit --no-fund && npm run typecheck

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Unit tests (no DB — pg is mocked globally)
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci --no-audit --no-fund
      # Run the full test suite. The api-server integration suite
      # was previously excluded (stale mock signatures from before
      # the requireAuth + coupon + is_visible changes) but has
      # since been modernised — all 299 tests now pass locally
      # and in CI (see docs/audit/verify-from-scratch-2026-06-23.md).
      - run: cd app && npm test
      # Upload coverage artifact (only on the main branch to save storage).
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # 4. DB-backed integration test (spins up PostgreSQL 17 + applies schema)
  # ───────────────────────────────────────────────────────────────────────────
  db-integration:
    name: DB Integration
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # Only run on main / when explicitly requested. Pull requests get the
    # unit-test job above which is fast and offline.
    if: github.event_name == 'push' || contains(github.head_ref, 'db')
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noufex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_PATH: ${{ github.workspace }}/app/node_modules
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: noufex_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noufex_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci --no-audit --no-fund
      # Apply schema + seed.
      - name: Run db:setup
        run: node ../scripts/db-setup.cjs
      # Tiny integration smoke — confirms the API can talk to the DB.
      - name: Smoke (DB query via MCP)
        run: node -e "const{Client}=require('pg');(async()=>{const c=new Client({connectionString:'postgresql://postgres:postgres@localhost:5432/noufex_db'});await c.connect();const r=await c.query('SELECT COUNT(*)::int AS n FROM users');console.log('users:',r.rows[0].n);await c.end();})()"

  # ───────────────────────────────────────────────────────────────────────────
  # 4b. Server boot smoke — boots the real API against a real Postgres
  #     and exercises the public HTTP surface (/api/health, /api/ready,
  #     /api/stats/home). Catches the class of bugs that unit tests
  #     miss: bad env wiring, route-mount typos, runtime config issues,
  #     the DB ↔ API handshake, and the 503 vs 200 distinction in
  #     /api/ready. Runs in parallel with the build job.
  # ───────────────────────────────────────────────────────────────────────────
  server-boot:
    name: Server Boot Smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'push' || contains(github.head_ref, 'db') || contains(github.head_ref, 'server') || contains(github.head_ref, 'ci')
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noufex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: noufex_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noufex_db
      AUTH_SECRET: test-secret-must-be-at-least-32-chars-long-xxx
      API_PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci --no-audit --no-fund
      - name: Apply schema + seed
        run: node ../scripts/db-setup.cjs
      - name: Boot API + smoke
        run: |
          set -e
          cd app
          # Boot in background. Redirect all output to a log file we can
          # dump on failure. npx tsx is fine here because the deps are
          # already installed and node 20 is on PATH.
          (npx tsx server/index.ts > /tmp/noufex-api.log 2>&1) &
          API_PID=$!
          # Always kill the server when this step exits (success or fail).
          # GitHub Actions tears down the runner after, but killing here
          # means the next test (db-integration in the same job, or
          # future steps) sees a clean port 3000.
          trap "kill $API_PID 2>/dev/null || true" EXIT
          # Wait up to 30s for the server to come up.
          BOOTED=0
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "API ready after ${i}s (health=$CODE)"
              BOOTED=1
              break
            fi
            sleep 1
          done
          if [ "$BOOTED" != "1" ]; then
            echo "API did not become ready within 30s"
            echo "--- API log ---"
            cat /tmp/noufex-api.log
            exit 1
          fi
          # Public smoke checks. /api/health and /api/ready are
          # un-authenticated; /api/stats/home is the public landing-page
          # stats endpoint. All three must return 200.
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)
          READY=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready)
          STATS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/stats/home)
          echo "health: $HEALTH  ready: $READY  stats: $STATS"
          if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ] || [ "$STATS" != "200" ]; then
            echo "Smoke check failed"
            echo "--- API log ---"
            cat /tmp/noufex-api.log
            exit 1
          fi
          # Body shape sanity: /api/health must report status=ok and an
          # uptime_s number. Catches a 200-with-broken-JSON regression.
          HEALTH_BODY=$(curl -sS http://127.0.0.1:3000/api/health)
          echo "health body: $HEALTH_BODY"
          echo "$HEALTH_BODY" | grep -q '"status":"ok"' || { echo "health body missing status:ok"; exit 1; }
          echo "$HEALTH_BODY" | grep -q '"uptime_s":' || { echo "health body missing uptime_s"; exit 1; }

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Build artefacts (only after everything else passes)
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, db-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci --no-audit --no-fund
      - run: cd app && npm run build
      - run: cd mcp-server && npm ci --no-audit --no-fund && npm run build
      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: noufex-build
          path: |
            app/dist
            app/server/index.js
            mcp-server/dist
          retention-days: 7
