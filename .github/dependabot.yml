# Nouf-ex — Dependabot configuration
#
# D.2 in MASTER_PLAN.md - automated dependency update PRs.
# Dependabot opens a PR every Monday with any available updates;
# CI runs the normal pipeline (lint / typecheck / test / build)
# on the PR before it can be merged.
#
# See https://docs.github.com/en/code-security/dependabot for the full
# reference. Grouping rules keep the PR stream manageable: one PR per
# package group per week.

version: 2

# ─── npm monorepo workspaces ───────────────────────────────────────────────
# After the 2026-07-11 monorepo restructure, every package.json lives
# inside an npm workspace. Dependabot is configured per-workspace so
# production-vs-dev grouping and ignore-rules stay scoped.
updates:
  # apps/web — React SPA
  - package-ecosystem: 'npm'
    directory: '/apps/web'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Aden'
    open-pull-requests-limit: 5
    groups:
      web-production:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      web-development:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    labels:
      - 'dependencies'
      - 'npm'
      - 'web'

  # apps/api — Express backend
  - package-ecosystem: 'npm'
    directory: '/apps/api'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Aden'
    open-pull-requests-limit: 5
    groups:
      api-production:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      api-development:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    # Critical runtime deps — require manual review.
    ignore:
      - dependency-name: 'express'
      - dependency-name: 'pg'
      - dependency-name: 'jsonwebtoken'
      - dependency-name: 'zod'
    labels:
      - 'dependencies'
      - 'npm'
      - 'api'

  # apps/mcp-server — Model Context Protocol server
  - package-ecosystem: 'npm'
    directory: '/apps/mcp-server'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Aden'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'npm'
      - 'mcp-server'

  # packages/shared — shared types (dep on api + web)
  - package-ecosystem: 'npm'
    directory: '/packages/shared'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Aden'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'npm'
      - 'shared'

  # ─── GitHub Actions ────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Aden'
    open-pull-requests-limit: 2
    groups:
      actions-group:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'github-actions'
