# Nouf-ex — Deploy to Staging
#
# D.4 in MASTER_PLAN.md. Runs after every push to main that passes
# the CI checks. Builds the production artefacts, downloads them,
# rsyncs them to the staging host, and restarts the docker compose
# stack on the staging server.
#
# Required GitHub Actions secrets (set under
# Settings → Secrets and variables → Actions):
#   STAGING_HOST          — SSH hostname, e.g. staging.noufex.example.com
#   STAGING_USER          — SSH user, e.g. deploy
#   STAGING_SSH_KEY       — SSH private key (use a deploy key)
#   STAGING_URL           — public URL for smoke checks
#   AUTH_SECRET_STAGING   — HMAC key for the staging environment
#   DB_PASSWORD_STAGING   — postgres password for the staging DB
#   DATABASE_URL_STAGING  — full connection string (optional;
#                            if absent, derived from the pieces)
#
# See SECRETS.md for the rotation policy.
#
# Adding/changing secrets: edit .github/SECRETS.md too so the docs
# stay in sync with the workflow.

name: Deploy to Staging

on:
  push:
    branches: [main]
  # Allow manual re-deploys from the Actions tab.
  workflow_dispatch:

# Cancel in-progress runs of the same workflow when a new commit
# lands. The deploy script is idempotent but avoiding overlapping
# deploys prevents the staging URL from flickering.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN permissions are read-only. We need to upload
# the build artefact from the CI workflow, so this workflow needs
# `actions: read` and to read secrets. The `actions/download-artifact`
# action is granted via `actions: read`. SSH/SCP is done via the
# webfactory/ssh-agent which uses the `STAGING_SSH_KEY` secret.
permissions:
  contents: read
  actions: read

env:
  APP_DIR: app
  REMOTE_DIR: /opt/noufex

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only run after CI passes (mirrors the same status check matrix
    # as the protection rules in branch-protection.md).
    needs:
      - ci / Lint
      - ci / Typecheck
      - ci / Test
      - ci / Build
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - name: Validate required secrets
        env:
          REQUIRED: STAGING_HOST,STAGING_USER,STAGING_SSH_KEY,STAGING_URL,AUTH_SECRET_STAGING,DB_PASSWORD_STAGING
        run: |
          for var in ${REQUIRED//,/ }; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done
          echo "All required secrets are present."

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          name: noufex-build
          path: build/

      - name: Verify artefacts
        run: |
          set -e
          test -f build/${{ env.APP_DIR }}/dist/index.html || { echo "::error::missing dist/index.html"; exit 1; }
          test -f build/${{ env.APP_DIR }}/server/index.js || { echo "::error::missing server/index.js"; exit 1; }
          echo "Artefacts present:"
          ls -la build/${{ env.APP_DIR }}/dist | head -3
          ls -la build/${{ env.APP_DIR }}/server | head -3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Upload artefacts to staging
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "mkdir -p ${{ env.REMOTE_DIR }}/build/${{ env.APP_DIR }}/dist \
                     ${{ env.REMOTE_DIR }}/build/${{ env.APP_DIR }}/server"
          scp -r build/${{ env.APP_DIR }}/dist/. \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ env.REMOTE_DIR }}/build/${{ env.APP_DIR }}/dist/
          scp build/${{ env.APP_DIR }}/server/index.js \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ env.REMOTE_DIR }}/build/${{ env.APP_DIR }}/server/

      - name: Apply env + restart stack
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET_STAGING }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_STAGING }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} <<'EOF'
            set -e
            cd ${{ env.REMOTE_DIR }}
            # 1. Make sure the staging DB is migrated.
            (cd app && npm ci --no-audit --no-fund && npm run db:setup) || true
            # 2. Atomically swap the new artefacts in.
            mv build/app/dist/* app/dist/ 2>/dev/null || true
            mv build/app/server/index.js app/server/
            rm -rf build
            # 3. Re-create the env file with the staging values.
            cat > .env <<EOT
            NODE_ENV=production
            API_PORT=3000
            HOST=0.0.0.0
            SERVE_STATIC=true
            STATIC_PATH=/app/dist
            DB_HOST=\${DB_HOST:-localhost}
            DB_PORT=\${DB_PORT:-5432}
            DB_NAME=\${DB_NAME:-noufex_db}
            DB_USER=\${DB_USER:-noufex_app}
            DB_PASSWORD=\${DB_PASSWORD}
            DATABASE_URL=\${DATABASE_URL}
            AUTH_SECRET=\${AUTH_SECRET}
            ALLOWED_ORIGINS=\${ALLOWED_ORIGINS:-https://staging.noufex.example.com}
            LOG_LEVEL=info
            EOT
            # 4. Restart the API + nginx (compose).
            cd ${{ env.REMOTE_DIR }}
            docker compose restart noufex || docker compose up -d
            echo "Stack restarted."

      - name: Wait for API to come back up
        run: |
          echo "Waiting for ${{ secrets.STAGING_URL }}/api/health ..."
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              "${{ secrets.STAGING_URL }}/api/health" 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not come back up within 60s"
          exit 1

      - name: Smoke checks
        run: |
          BASE="${{ secrets.STAGING_URL }}"
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/health")
          READY=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/ready")
          STATS=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/stats/home")
          echo "staging smoke: health=$HEALTH ready=$READY stats=$STATS"
          if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ] || [ "$STATS" != "200" ]; then
            echo "::error::Staging smoke check failed"
            exit 1
          fi
          echo "Smoke passed."

      - name: Comment on the trigger commit (if any)
        if: github.event_name == 'push'
        uses: marocoder/stale-action-comment@v1.0.0
        # Intentionally NOT auto-assigning / closing - the comment is
        # informational only.

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployed ${{ github.sha }} to staging."
            echo "URL: ${{ secrets.STAGING_URL }}"
          else
            echo "Deploy FAILED. Check the logs above."
          fi
