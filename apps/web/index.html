<!doctype html>
<!--
  Noufex SPA entry point.
  Yemen & Middle East B2B/B2C e-commerce marketplace platform.
  - lang="ar" / dir="rtl" must match the PWA manifest (`apps/api/dist/manifest.webmanifest`)
    and the production HTML (`apps/api/dist/index.html`). Keeping these three
    in sync prevents FOUC (Flash of Unstyled Content) between the static
    page load and the runtime i18n hydration.
  - In production, the server (`apps/api/src/index.ts` → SPA fallback handler)
    injects a per-request CSP nonce onto every <script>/<style> tag. The
    dev bundle (`/src/main.tsx`) does not need one — Vite's dev server
    serves the module graph over the same-origin ws connection.
-->
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0d9488" />
		<meta name="description" content="Noufex — منصة تجارة إلكترونية B2B/B2C لليمن والشرق الأوسط | B2B/B2C e-commerce marketplace for Yemen & Middle East" />
		<title>Noufex — سوق نوف</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
