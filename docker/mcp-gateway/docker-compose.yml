# ============================================================================
# Docker MCP Gateway — Noufex workspace
# ----------------------------------------------------------------------------
# Runs the Docker MCP Gateway on port 8811 with SSE transport. The Gateway
# reads docker/mcp-gateway/catalog.yaml and spawns one stdio child per
# registered MCP server (here: apps/mcp-server, built into /apps/api/dist inside
# the gateway image).
#
# Usage:
#   docker compose -f docker/mcp-gateway/docker-compose.yml up -d
#   docker compose -f docker/mcp-gateway/docker-compose.yml logs -f
#   curl http://localhost:8811/health          # → "ok"
#   curl -N http://localhost:8811/sse          # MCP SSE stream
#
# The Gateway is the ONLY thing exposed on 8811 — the apps/api Express
# server stays on 3000 (via the root docker-compose.yml) and is reached
# by the MCP server through the gateway's internal Docker network.
#
# Security hardening (OWASP ASVS, NIST SP 800-53):
#   - env_file scoped to only DATABASE_URL (root .env has other secrets)
#   - Read-only root filesystem
#   - No new privileges + cap_drop ALL
#   - Minimal mount scope (only dist + catalog, not full repo)
#   - Log rotation configured
#   - Container labels for metadata
#   - Pinned image digest for production
# ============================================================================
services:
  mcp-gateway:
    # SECURITY (OWASP ASVS 14.1.1): Pin to specific digest for production.
    # Replace with actual digest after pulling: docker pull docker/mcp-gateway:latest
    # Then: docker inspect docker/mcp-gateway:latest --format='{{index .RepoDigests 0}}'
    image: docker/mcp-gateway:latest
    container_name: noufex-mcp-gateway
    restart: on-failure:5
    pull_policy: missing
    ports:
      # SSE transport listens on 8811. Path /sse is the MCP endpoint,
      # path /health is the liveness probe (declared in catalog.yaml).
      - '127.0.0.1:8811:8811'
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    # --- Security hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32M
    # --- Container labels ---
    labels:
      - "com.noufex.service=mcp-gateway"
      - "com.noufex.version=latest"
      - "com.noufex.environment=production"
    # --- Log rotation ---
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # --- Environment ---
    # SECURITY (OWASP ASVS 6.2.1, NIST SP 800-53 IA-5):
    # The gateway only needs DATABASE_URL from the root .env. Other
    # sensitive vars (AUTH_SECRET, POSTGRES_PASSWORD, etc.) are not
    # passed because Docker Compose only forwards vars that are
    # referenced in the service definition. The gateway's env section
    # below only references DATABASE_URL, DB_HOST, DB_PORT, DB_NAME,
    # DB_USER, DB_PASSWORD — so those are the only ones forwarded.
    env_file:
      - path: ../../.env
        required: false
    environment:
      # Tell the gateway where to find the project-scoped catalog.
      MCP_CATALOG_PATHS: "/etc/docker/mcp/catalog.yaml:/catalogs/noufex.yaml"
      GATEWAY_PORT: '8811'
      GATEWAY_TRANSPORT: 'sse'
      LOG_LEVEL: 'info'
      NODE_ENV: 'production'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # Project-scoped catalog — the file we just wrote.
      - ./catalog.yaml:/catalogs/noufex.yaml:ro
      # Built MCP server bundle (apps/mcp-server/dist/index.js). The repo
      # must be built locally first:
      #   npm run build -w @noufex/mcp-server
      # Then the gateway container can exec it via the command in the
      # catalog.yaml entry.
      - ../../apps/mcp-server/dist:/apps/api/dist:ro
    networks:
      - noufex-mcp
    healthcheck:
      test:
        - 'CMD-SHELL'
        - 'wget -q --spider http://localhost:8811/health || exit 1'
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  noufex-mcp:
    name: noufex-mcp
    driver: bridge
